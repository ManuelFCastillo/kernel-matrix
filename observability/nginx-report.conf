server {
    listen 80;
    root /usr/share/nginx/html;

    # Serve report.html at / so the URL is memorable, but keep the directory
    # index available at /files/ for pulling raw JSON and JUnit XML.
    location = / {
        try_files /report.html =404;
    }

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # No caching: this is a dashboard, and a stale render is worse than a slow one.
    add_header Cache-Control "no-store, must-revalidate";
}
